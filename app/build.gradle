plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}
android {
    namespace 'com.khush.viploader'
    compileSdk 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {
        applicationId 'com.khush.viploader'
        minSdk 30
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }
}
